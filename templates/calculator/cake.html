{{ define "title" }}Cake Calculator{{ end }}

{{ define "calcContent" }}
<h1>Test..This is Cake Calculator!</h1>
<div class="calc-layout">
  <div class="inputs">
    <form action="/calculator/results" method="post" id="calc-form">
      <select name="calculator-option" id="calculator-cake" title="calculator-cake">
        <option value="">Choose an option</option>
        <option value="free-form">Free Form</option>
        <option value="high-ratio-cake">High-Ratio Cake</option>
        <option value="pound-cake">Pound Cake</option>
        <option value="sponge-cake">Sponge Cake</option>
      </select>
      <input type="hidden" name="calculatorFor" value="cake">

      <div id="free-form" class="cake-options hidden">
        <h3>Calculating With Your Own Ratios</h3>
      </div>
      <div id="high-ratio-cake" class="cake-options hidden">
        <h3>Calculating For High Ratio Cake</h3>
      </div>
      <div id="pound-cake" class="cake-options hidden">
        <h3>Calculating For Pound Cake</h3>
      </div>
      <div id="sponge-cake" class="cake-options hidden">
        <h3>Calculating For Sponge Cake</h3>
      </div>

      <!-- Getting pan dimensions or volumn of container -->
      <div id="pan-dimension" class="cake-options hidden">
        <h4>What are the dimensions of your pan?</h4>
        <div id="measure">
          <div class="form-element">
            <label for="measurement">Measurement</label>
            <select name="measurement" id="measurement">
              <option value="inches">Inches</option>
              <option value="centimeters">Centimeters</option>
            </select>
          </div>
        </div>
        <div class="form-element">
          <label for="shape">Pan Shape</label>
          <select name="shape" id="shape">
            <option value="">Select a Shape</option>
            <option value="square">Square..ish</option>
            <option value="round">Round</option>
            <option value="weird">Weird</option>
          </select>
        </div>
        <div class="hidden pan-shape" id="square">
          <div class="form-element">
            <label for="height">Height</label>
            <input type="number" id="height" name="height">
          </div>
          <div class="form-element">
            <label for="width">Width</label>
            <input type="number" id="width" name="width">
          </div>
        </div>
        <div class="hidden pan-shape" id="round">
          <div class="form-element">
            <label for="diameter">Diameter</label>
            <input type="number" id="diameter" name="diameter">
          </div>
        </div>
        <div id="depth-view" class="hidden pan-shape">
          <div class="form-element">
            <label for="depth">Depth</label>
            <input type="number" id="depth" name="depth">
          </div>
        </div>
        <div class="hidden pan-shape" id="weird">
          <div class="form-element">
            <label for="volumn">Volumn</label>
            <input type="number" id="volumn" name="volumn">
          </div>
        </div>
      </div>

      <!-- Ingredients -->
      <div class="allRecipe form-element hidden" id="hydration-view">
        <label for="hydration">Hydration Percentage</label>
        <input type="number" id="hydration" name="hydration">
      </div>
      <div class="allRecipe form-element hidden" id="fat-view">
        <label for="fat">Fat Percentage</label>
        <input type="number" id="fat" name="fat">
      </div>
      <div class="allRecipe form-element hidden" id="sugar-view">
        <label for="sugar">Sugar Percentage</label>
        <input type="number" id="sugar" name="sugar">
      </div>
      <div class="allRecipe form-element hidden" id="salt-view">
        <label for="salt">Salt Percentage</label>
        <input type="number" id="salt" name="salt">
      </div>
      <div class="allRecipe form-element hidden" id="egg-view">
        <label for="egg">Egg Percentage</label>
        <input type="number" id="egg" name="egg">
      </div>
      <input id="cake-submission" type="submit" value="Submit" class="hidden">
    </form>
  </div>
  <div>
    <h2>Instructions:</h2>
    <div class="info" id="info-box"> </div>
  </div>
</div>
<script src="/static/js/cake.js"></script>
<script src="/static/js/utils.js"></script>
<script src="/static/js/calc_info.js"></script>
{{ end }}
